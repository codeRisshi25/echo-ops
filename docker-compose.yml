services:
  endee:
    image: endee/endee-oss:latest
    container_name: endee
    ports:
      - "8080:8080"
    environment:
      NDD_AUTH_TOKEN: ""     # open mode, no auth required
      NDD_NUM_THREADS: 0     # auto-detect CPU threads
    volumes:
      - endee-data:/data
    restart: unless-stopped

volumes:
  endee-data:
